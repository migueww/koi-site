<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koi</title>
<style>
  :root { --paper: #F4F1EA; --ink: #111111; --soft: #4A4A4A; --muted: #6E6A62; }
  @media (prefers-color-scheme: dark) { :root { --paper: #000000; --ink: #FFFFFF; --soft: #A3A3A3; --muted: #8A8A8A; } }
  body { margin: 0; background: var(--paper); color: var(--soft); font: 17px/1.6 Inter, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 72px 20px; }
  h1 { color: var(--ink); font-size: 44px; letter-spacing: -1.4px; margin: 0 0 8px; }
  .tag { color: var(--ink); font-size: 22px; font-weight: 700; margin: 0 0 24px; }
  a { color: var(--ink); }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Koi</h1>
  <p class="tag">Stories sim. Reels não.</p>
  <p>O Koi conta os reels do Instagram e os shorts do YouTube que você vê e te ajuda a ver menos. Sem cadastro, e seus dados de uso nunca saem do celular.</p>
  <p>Em breve na Play Store.</p>
  <footer><a href="privacidade.html">Política de privacidade</a></footer>
</main>
</body>
</html>
